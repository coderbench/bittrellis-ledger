<rect class="bg" x="0.5" y="0.5" width="899" height="469" rx="12"/>
<text x="24.0" y="36.0" class="t" font-size="18" font-weight="600" text-anchor="start">Which trade-off each merged recipe makes</text>
<text x="24.0" y="57.0" class="m" font-size="12" font-weight="400" text-anchor="start">Up is closer to the original model; right reads prompts faster. Labels give peak GPU memory.</text>
