<text x="241.2" y="398.0" class="m" font-size="11" font-weight="400" text-anchor="middle">37,000</text>
<text x="398.4" y="398.0" class="m" font-size="11" font-weight="400" text-anchor="middle">38,000</text>
<text x="555.6" y="398.0" class="m" font-size="11" font-weight="400" text-anchor="middle">39,000</text>
<text x="712.8" y="398.0" class="m" font-size="11" font-weight="400" text-anchor="middle">40,000</text>
